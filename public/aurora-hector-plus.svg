<ellipse cx="286" cy="390" rx="24" ry="16" fill="#0b1014" stroke="#cdd3d7" stroke-width="3"/><text x="286" y="396" font-family="Arial,sans-serif" font-weight="700" font-size="17" text-anchor="middle" fill="#e8edf0">MG</text>
<!-- front LED signature -->
<path d="M158 344 L229 350 L249 345 L245 354 L226 360 L158 354Z" fill="#111920" stroke="#c5dbe6" stroke-width="2"/><path d="M164 348 L226 354" stroke="#f6fdff" stroke-width="4" stroke-linecap="round"/><path d="M171 351 L220 356" stroke="#a5e7ff" stroke-width="2"/>
<!-- lower bumper and chrome blades -->
<path d="M159 407 L193 419 L311 425 L383 408 L373 428 L221 445 L166 429Z" fill="#252c31" stroke="#89939b" stroke-width="3"/>
<path d="M174 425 L226 438 L347 425" fill="none" stroke="url(#chrome)" stroke-width="5" stroke-linecap="round"/>
<path d="M173 437 L220 448 L345 435" fill="none" stroke="#11171b" stroke-width="5"/>

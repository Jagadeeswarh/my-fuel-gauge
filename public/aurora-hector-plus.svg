<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Aurora Silver MG Hector Plus</title><desc id="desc">Detailed silver MG Hector Plus in front three-quarter view, lit by sunlight from the upper right, with a soft natural shadow cast beneath and to the left. Transparent background.</desc>
<defs>
 <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafb"/><stop offset=".18" stop-color="#cfd5da"/><stop offset=".38" stop-color="#929ca5"/><stop offset=".52" stop-color="#e9edf0"/><stop offset=".69" stop-color="#8e989f"/><stop offset=".84" stop-color="#c5cbd0"/><stop offset="1" stop-color="#68727b"/></linearGradient>
 <linearGradient id="hood" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f9fbfc"/><stop offset=".3" stop-color="#d7dce0"/><stop offset=".68" stop-color="#9ba5ad"/><stop offset="1" stop-color="#edf0f2"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19252d"/><stop offset=".45" stop-color="#34434d"/><stop offset=".7" stop-color="#111b22"/><stop offset="1" stop-color="#65727b"/></linearGradient>
 <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".35" stop-color="#aeb7be"/><stop offset=".6" stop-color="#f8fafb"/><stop offset="1" stop-color="#737d85"/></linearGradient>
 <linearGradient id="tire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#394047"/><stop offset=".5" stop-color="#090c0f"/><stop offset="1" stop-color="#262d32"/></linearGradient>
 <radialGradient id="rim"><stop stop-color="#f7f9fa"/><stop offset=".42" stop-color="#9ba4ab"/><stop offset=".75" stop-color="#e3e7e9"/><stop offset="1" stop-color="#454d53"/></radialGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="shadow" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="17"/></filter>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
 <g id="wheel"><ellipse rx="86" ry="108" fill="#111518"/><ellipse rx="75" ry="96" fill="url(#tire)" stroke="#626b72" stroke-width="3"/><ellipse rx="61" ry="79" fill="#11161a" stroke="#080b0d" stroke-width="4"/><ellipse rx="49" ry="65" fill="url(#rim)" stroke="#b9c0c5" stroke-width="2"/>
 <g fill="#384149" stroke="#e9edef" stroke-width="2"><path d="M-8 -58 L8 -58 L15 -13 L4 0 L-8 -8Z"/><path d="M-8 -58 L8 -58 L15 -13 L4 0 L-8 -8Z" transform="rotate(45)"/><path d="M-8 -58 L8 -58 L15 -13 L4 0 L-8 -8Z" transform="rotate(90)"/><path d="M-8 -58 L8 -58 L15 -13 L4 0 L-8 -8Z" transform="rotate(135)"/><path d="M-8 -58 L8 -58 L15 -13 L4 0 L-8 -8Z" transform="rotate(180)"/><path d="M-8 -58 L8 -58 L15 -13 L4 0 L-8 -8Z" transform="rotate(225)"/><path d="M-8 -58 L8 -58 L15 -13 L4 0 L-8 -8Z" transform="rotate(270)"/><path d="M-8 -58 L8 -58 L15 -13 L4 0 L-8 -8Z" transform="rotate(315)"/></g><circle r="22" fill="#171d22" stroke="#f3f5f6" stroke-width="3"/><circle r="14" fill="#b9c1c7"/><circle r="8" fill="#343d44"/><g fill="#101417"><circle cx="0" cy="-31" r="3"/><circle cx="31" cy="0" r="3"/><circle cx="0" cy="31" r="3"/><circle cx="-31" cy="0" r="3"/></g><path d="M-50 -48 Q-24 -76 10 -71" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/></g>
</defs>
<!-- Soft shadow falls down-left from a strong upper-right sun; no backdrop is painted. -->
<ellipse cx="550" cy="491" rx="450" ry="48" fill="#18212a" opacity=".2" filter="url(#shadow)"/>
<ellipse cx="590" cy="478" rx="330" ry="24" fill="#222a31" opacity=".13" filter="url(#soft)"/>
<!-- rear wheel -->
<g transform="translate(880 391) scale(.82)"><use href="#wheel"/></g>
<!-- body silhouette and sculpted rear quarter -->
<path d="M145 358 L177 303 Q195 279 238 267 L388 236 Q440 169 508 143 Q551 127 634 135 L756 155 Q800 164 833 205 L933 255 Q970 272 1000 302 L1030 343 L1012 395 L950 422 L235 432 L162 405Z" fill="url(#body)" stroke="#606a72" stroke-width="3"/>

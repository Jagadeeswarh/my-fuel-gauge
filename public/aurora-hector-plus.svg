<path d="M566 154 L562 230" stroke="#10171c" stroke-width="9"/><path d="M701 193 L691 239" stroke="#151d23" stroke-width="8"/>
<path d="M427 216 L478 164 Q490 155 512 155" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4"/>
<path d="M585 164 Q641 168 673 199" fill="none" stroke="#d8e4eb" stroke-opacity=".38" stroke-width="3"/>
<!-- front bonnet, sunlit on right -->
<path d="M140 351 L184 306 Q203 286 249 276 L401 245 L453 275 L418 329 L300 372 L160 391Z" fill="url(#hood)" stroke="#69737b" stroke-width="3"/>
<path d="M205 307 Q290 286 388 262" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".78"/>
<path d="M221 337 Q303 317 399 285" fill="none" stroke="#727d86" stroke-width="2" opacity=".5"/>
<path d="M155 358 Q253 356 325 342" fill="none" stroke="#f9fbfc" stroke-width="3" opacity=".7"/>
<!-- front fascia -->
<path d="M143 350 L302 364 L419 326 L430 365 L395 410 L201 431 L151 404Z" fill="url(#body)" stroke="#6a747c" stroke-width="3"/>
<path d="M146 353 L301 366 L414 330 L407 348 L302 382 L151 372Z" fill="#252d33" stroke="#c7cdd1" stroke-width="3"/>

<path d="M420 270 L694 250 L784 232 L933 255 Q969 272 1000 302 L1023 344 L1000 381 L927 404 L399 423 L418 365 L453 275Z" fill="url(#body)" stroke="#68727a" stroke-width="2"/>
<path d="M437 279 L692 258 L776 242 L923 267" fill="none" stroke="#fff" stroke-width="5" opacity=".78"/>
<path d="M449 294 L680 275 L764 261" fill="none" stroke="#7a858e" stroke-width="2" opacity=".65"/>
<path d="M443 310 L445 390 L423 418" fill="none" stroke="#626d75" stroke-width="3"/>
<path d="M566 280 L567 394" stroke="#657079" stroke-width="3"/><path d="M575 279 L578 392" stroke="#f6f8f9" stroke-width="2" opacity=".65"/>
<path d="M700 264 L722 390" stroke="#657079" stroke-width="3"/><path d="M709 263 L733 388" stroke="#f5f7f8" stroke-width="2" opacity=".65"/>
<path d="M460 337 Q620 311 780 296" fill="none" stroke="#f9fbfc" stroke-width="3" opacity=".8"/>
<path d="M461 363 Q633 338 796 324" fill="none" stroke="#6b757d" stroke-width="3" opacity=".65"/>
<path d="M464 371 Q620 349 783 339" fill="none" stroke="#fff" stroke-width="2" opacity=".65"/>
<path d="M466 390 Q640 371 825 354" fill="none" stroke="#5e6870" stroke-width="2" opacity=".65"/>
<!-- door handles -->
<g fill="#343c42" stroke="#eef1f3" stroke-width="2"><rect x="604" y="287" width="44" height="9" rx="4"/><rect x="756" y="271" width="42" height="9" rx="4"/></g>
<!-- mirror -->
<path d="M420 259 L455 253 Q471 256 473 271 L460 287 L429 284 L415 271Z" fill="url(#body)" stroke="#606b73" stroke-width="3"/><path d="M428 270 L462 266" stroke="#fff" stroke-width="3"/>
<!-- front wheel -->
<g transform="translate(415 402) scale(.96)"><use href="#wheel"/></g>
<!-- wheel arches overlay -->
<path d="M326 395 Q340 300 414 300 Q484 300 500 390" fill="none" stroke="#30383e" stroke-width="18"/><path d="M332 391 Q350 309 414 309 Q474 309 493 391" fill="none" stroke="url(#body)" stroke-width="5"/>
<path d="M798 382 Q813 300 879 300 Q943 300 960 380" fill="none" stroke="#2b3339" stroke-width="16"/><path d="M804 379 Q820 309 879 309 Q935 309 954 379" fill="none" stroke="url(#body)" stroke-width="5"/>
<!-- lower sill -->
<path d="M490 415 L794 394 L810 410 L505 438Z" fill="#252d33" stroke="#727d85" stroke-width="3"/>
<path d="M514 423 L778 403" stroke="url(#chrome)" stroke-width="5"/>
<!-- side cladding and rear lamp -->
<path d="M962 291 L984 303 L1009 338 L1004 359 L990 350 L980 323Z" fill="#a71922" stroke="#e9b5b8" stroke-width="2"/>
<path d="M979 311 L997 340" stroke="#ff6a70" stroke-width="4"/>
<!-- roof rails -->
<path d="M452 146 L623 133 Q649 135 668 151" fill="none" stroke="#424b52" stroke-width="7" stroke-linecap="round"/><path d="M453 143 L621 130 Q650 132 667 147" fill="none" stroke="#eef2f4" stroke-width="3" stroke-linecap="round"/>
<!-- crisp sun rim highlights from upper-right -->
<path d="M637 137 Q702 143 747 180 L816 238 L929 263 Q974 280 1002 317" fill="none" stroke="#fff" stroke-width="6" opacity=".75"/>
<path d="M694 259 L780 243 L920 267" fill="none" stroke="#fff" stroke-width="3" opacity=".85"/>
<path d="M813 398 L924 387 L989 367" fill="none" stroke="#f7fafb" stroke-width="3" opacity=".72"/>
<!-- glassy front lamp details -->
<path d="M151 348 L230 356" stroke="#fff" stroke-width="2" opacity=".9"/>
<!-- small natural contact shadows at tires -->
<ellipse cx="415" cy="491" rx="70" ry="10" fill="#101820" opacity=".24" filter="url(#soft)"/>
<ellipse cx="880" cy="481" rx="62" ry="9" fill="#101820" opacity=".2" filter="url(#soft)"/>
</svg>
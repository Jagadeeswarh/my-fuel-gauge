<path d="M171 375 L298 387 L386 362" fill="none" stroke="#4c565e" stroke-width="2"/>
<g stroke="#7e8991" stroke-width="2" opacity=".8"><path d="M180 383 L365 381"/><path d="M188 392 L354 392"/><path d="M203 401 L339 402"/><path d="M215 375 L209 405"/><path d="M238 378 L232 409"/><path d="M261 380 L257 411"/><path d="M284 382 L280 414"/><path d="M307 380 L305 412"/><path d="M330 373 L331 405"/><path d="M352 366 L355 397"/></g>
